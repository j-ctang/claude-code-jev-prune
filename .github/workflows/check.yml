name: Check

on:
  pull_request:
    branches: [staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-check:
    name: offline-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_IMAGE: node:22-bookworm@sha256:0e5f906573693feaa1e21057ebdcfdb5bd5021f050b2dc7c9deceb629c7da2a8
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      # Downloads happen before isolation; no API credentials are supplied.
      - name: Install locked dependencies
        run: npm ci

      - name: Pull pinned check image
        run: docker pull "$NODE_IMAGE"

      - name: Prove network isolation
        shell: bash
        run: |
          docker run --rm --network none -i \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e CI=true -e TYPESAFE_API_KEY=tsf_ci_dummy \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            "$NODE_IMAGE" node --input-type=module <<'JS'
          import net from 'node:net';
          const server = net.createServer(socket => socket.end());
          await new Promise(resolve => server.listen(0, '127.0.0.1', resolve));
          const port = server.address().port;
          await new Promise((resolve, reject) => {
            const socket = net.connect(port, '127.0.0.1');
            socket.setTimeout(2000);
            socket.once('connect', () => { socket.destroy(); resolve(); });
            socket.once('error', reject);
            socket.once('timeout', () => {
              socket.destroy();
              reject(new Error('Loopback probe timed out'));
            });
          });
          await new Promise(resolve => server.close(resolve));
          await new Promise((resolve, reject) => {
            const socket = net.connect(443, '1.1.1.1');
            socket.setTimeout(2000);
            socket.once('connect', () => {
              socket.destroy();
              reject(new Error('External network reachable'));
            });
            socket.once('error', error => {
              if (['ENETUNREACH', 'EHOSTUNREACH'].includes(error.code)) resolve();
              else reject(error);
            });
            socket.once('timeout', () => {
              socket.destroy();
              reject(new Error('Isolation probe timed out'));
            });
          });
          console.log('Loopback works; external TCP is blocked');
          JS

      - name: Run full check without external networking
        run: |
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e CI=true -e TYPESAFE_API_KEY=tsf_ci_dummy \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            "$NODE_IMAGE" npm run check
